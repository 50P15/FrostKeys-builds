name: Build release APK

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'   # cada 6 horas

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.c.outputs.sha }}
      short: ${{ steps.c.outputs.short }}
      skip: ${{ steps.c.outputs.skip }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git ls-remote https://github.com/AshwinSoni-01/FrostKeys HEAD | cut -f1)
          SHORT=${SHA:0:7}
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "short=$SHORT" >> $GITHUB_OUTPUT
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && gh release view "build-$SHORT" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Sin cambios ($SHORT), no se compila"
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: AshwinSoni-01/FrostKeys
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Compilar release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Firmar APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          IN=$(ls app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -f 4 "$IN" aligned.apk
          $BT/apksigner sign --ks keystore.jks \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --out FrostKeys-release.apk aligned.apk
          rm keystore.jks

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository }}
          tag_name: build-${{ needs.check.outputs.short }}
          name: FrostKeys ${{ needs.check.outputs.short }}
          body: "Compilado desde AshwinSoni-01/FrostKeys@${{ needs.check.outputs.sha }}"
          files: FrostKeys-release.apk
          prerelease: true
