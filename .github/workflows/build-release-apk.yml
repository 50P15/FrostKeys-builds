name: Build release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Compilar release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Firmar APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          IN=$(ls app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -f 4 "$IN" aligned.apk
          $BT/apksigner sign --ks keystore.jks \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --out FrostKeys-release.apk aligned.apk
          rm keystore.jks

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FrostKeys build ${{ github.run_number }}
          files: FrostKeys-release.apk
          prerelease: true
